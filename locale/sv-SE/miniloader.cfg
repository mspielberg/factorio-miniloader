[mod-setting-description]
miniloader-energy-usage=När detta är aktiverat måste minilastare vara anslutna till ett elnät.
miniloader-snapping=Snäpp minilastare till transportband när de byggs eller när intilliggande transportband roteras.
miniloader-double-recipes=Fördubblar receptens kostnad och resultat så att underjordiska transportband förbrukas parvis.
miniloader-lock-stack-sizes=När detta är aktiverat flyttar minilastare alltid ett föremål åt gången. Om det inaktiveras kan obegränsade stapelstorlekar användas. Det minskar belastningen på speluppdateringarna (UPS), men gör föremålsflödet mindre jämnt.

